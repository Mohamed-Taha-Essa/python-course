{% extends 'blog/base.html' %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="fw-bold mb-4">Delete "{{ post.title }}"?</h1>
    <p class="text-muted">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete it</button>
        <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock content %}
